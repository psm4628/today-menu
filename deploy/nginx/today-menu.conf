# /etc/nginx/conf.d/today-menu.conf 용 (http 컨텍스트 안에 include 되므로 server 블록만 둔다)
server {
    listen 8081;
    server_name localhost 127.0.0.1;
    root /var/www/today-menu;
    index index.html;
    charset utf-8;

    # /api/ 요청은 경로 그대로 FastAPI(8004)로 전달한다. proxy_pass 끝에 /를 붙이지 않는다.
    location /api/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면은 Nginx만 제공한다. 없는 파일은 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
